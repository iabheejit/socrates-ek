name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Nodejs_backend/package-lock.json

      - name: Install dependencies
        working-directory: ./Nodejs_backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./Nodejs_backend
        run: npm run lint
        continue-on-error: true

      - name: Check code formatting
        working-directory: ./Nodejs_backend
        run: npx prettier --check "**/*.{js,json,md}"
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Nodejs_backend/package-lock.json

      - name: Install dependencies
        working-directory: ./Nodejs_backend
        run: npm ci

      - name: Run tests
        working-directory: ./Nodejs_backend
        run: npm test
        env:
          NODE_ENV: test

      - name: Generate coverage report
        working-directory: ./Nodejs_backend
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: Nodejs_backend/coverage/
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Nodejs_backend/package-lock.json

      - name: Run npm audit
        working-directory: ./Nodejs_backend
        run: npm audit --audit-level=moderate
        continue-on-error: true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [test, security-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ./Nodejs_backend
        run: docker build -t ekatra-backend:test .

      - name: Test Docker image
        run: |
          docker run -d --name test-container -p 3000:3000 \
            -e AIRTABLE_PERSONAL_ACCESS_TOKEN=test \
            -e AIRTABLE_STUDENT_BASE_ID=test \
            -e AIRTABLE_COURSE_BASE_ID=test \
            -e URL=test \
            -e API=test \
            -e WATI_URL_FOR_CERTIFICATE=test \
            -e WAIT_API=test \
            -e AZURE_LLAMA_ENDPOINT=test \
            -e AZURE_LLAMA_API_KEY=test \
            -e azurestring=test \
            -e containername=test \
            -e port=3000 \
            ekatra-backend:test || true
          sleep 10
          docker logs test-container
          docker stop test-container || true
          docker rm test-container || true
